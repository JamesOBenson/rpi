# STEM Buddy Configuration
# Kid-friendly voice assistant settings

app:
  name: "STEM Buddy"
  wake_word: "buddy"
  interrupt_word: "stop"
  voice_speed: 1.0
  volume: 0.8

audio:
  sample_rate: 16000
  channels: 1
  buffer_size: 512
  listen_timeout: 10
  silence_threshold: 0.01
  silence_duration: 1.5

wake_word:
  sensitivity: 0.6
  framework: "fallback"  # "porcupine" or "fallback"

stt:
  engine: "vosk"
  # Wake-word model: "small" is correct for the hybrid architecture -
  # Vosk's only job is endpointing ("someone spoke"), and Whisper is the
  # actual wake-word judge. Measured on the Pi: the large model costs
  # ~5GB of RAM for no accuracy benefit here (small emitted finals on
  # 7/7 real user captures). Use "large" only if you switch back to
  # Vosk-only wake detection.
  model_size: "small"
  # Question engine:
  #   hailo   = Hailo-8L Whisper base (5s windows). ~0.6s vs ~1.8s for CPU.
  #             CPU Whisper stays loaded as wake-word judge + automatic
  #             fallback (if Hailo is absent, fails to load, or returns a
  #             transcript without the wake word, CPU Whisper re-runs).
  #             Accuracy on 13 real captures: 12/13 usable, 1 needed the
  #             CPU fallback (caught by the wake-word check).
  #   whisper = CPU-only (faster-whisper), most robust, ~1.8s per question
  question_engine: "hailo"
  # Hailo model assets (HEFs + weights, from the Hailo model zoo, H8L):
  #   models/hailo-whisper/base-whisper-encoder-5s_h8l.hef
  #   models/hailo-whisper/base-whisper-decoder-fixed-sequence-matmul-split_h8l.hef
  #   models/hailo-whisper/token_embedding_weight_base.npy
  #   models/hailo-whisper/onnx_add_input_base.npy
  #   data/hailo_whisper/mel_filters.npz
  # hailo_model_dir: "models/hailo-whisper"  # default
  # whisper_model (measured on Pi 5, int8, 4 threads):
  #   base.en  = ~0.5x real-time decode, near-perfect  * RECOMMENDED
  #   small.en = ~1.5x real-time decode, perfect (costs +3s per question)
  whisper_model: "base.en"
  # whisper_threads: 4 = the fast A76 cores only. 8 threads hits the slow
  # A55s and is ~2x slower (measured). Leave 4 on the Pi 5.
  whisper_threads: 4
  # Save every captured question to logs/audio/*.wav (for debugging)
  debug_audio: true
  language: "en-us"
  confidence_threshold: 0.5

llm:
  # Place .gguf files in models/
  # gemma-3n-e2b = FAST (~2.5 sec to first sentence), on-device design  * RECOMMENDED
  # qwen3-1.7b   = backup, same speed, equally good answers
  # qwen3-4b     = much smarter but ~25-33 sec answers (too slow for voice - do not use)
  model: "gemma-3n-E2B-it-Q4_K_M.gguf"
  context_window: 512  # Gemma 3(n) auto-bumps to 1024 (llama.cpp minimum)
  max_tokens: 100
  temperature: 0.3
  # This Pi exposes only the 4 fast A76 cores; 8 threads measured ~15% slower
  threads: 4

tts:
  engine: "piper"
  voice: "en_US-lessac-medium"
  output_format: "wav"
  pitch: 1.0

rag:
  enabled: true
  # top_k=2 measured faster AND more accurate than 3: the 1.5B model
  # chimeras answers when a third, weakly-related fact is in context
  # (bench: 10.4s vs 13.8s to first audio, cleaner answers).
  top_k: 2
  # Max cosine distance for a fact to be included in the LLM context.
  # 0.80 keeps garbled-but-relevant matches ("black horse" -> black hole
  # fact at 0.72) while dropping unrelated facts that confuse the model.
  # A question with NO fact within this distance AND no question word
  # triggers a "say it again?" prompt instead of a dead-end answer.
  similarity_threshold: 0.8

# GPIO Settings - Set enabled: false if Hailo HAT blocks the pins
gpio:
  enabled: false  # Set to true only if GPIO pins are accessible
  button_pin: 4   # GPIO pin for interrupt button
  led_red_pin: 17
  led_green_pin: 27
  led_blue_pin: 22

logging:
  level: "INFO"
  file: "logs/buddy.log"
  max_size: 1000000
  backup_count: 3